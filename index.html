inactive"], ["wholesome", "lành mạnh, bổ ích", "/ˈhəʊlsəm/", "wholesome food", "I prefer wholesome home-cooked meals.", "healthy"], ["moderation", "sự điều độ", "/ˌmɒdəˈreɪʃən/", "in moderation", "I enjoy snacks in moderation.", "restraint"], ["nourishing", "giàu dinh dưỡng", "/ˈnʌrɪʃɪŋ/", "nourishing meal", "A nourishing breakfast helps me start the day.", "nutritious"], ["well-being", "sức khỏe và trạng thái sống tốt", "/ˌwel ˈbiːɪŋ/", "mental well-being", "Good sleep supports overall well-being.", "welfare"], ["deprivation", "sự thiếu hụt", "/ˌdeprɪˈveɪʃən/", "sleep deprivation", "Sleep deprivation affects concentration.", "lack"], ["burnout", "kiệt sức do căng thẳng kéo dài", "/ˈbɜːnaʊt/", "experience burnout", "Constant pressure can lead to burnout.", "exhaustion"], ["recreation", "hoạt động giải trí", "/ˌrekriˈeɪʃən/", "recreational activities", "Recreation is important after studying.", "leisure"], ["work-life balance", "cân bằng công việc và cuộc sống", "/ˌwɜːk laɪf ˈbæləns/", "maintain work-life balance", "A flexible routine supports work-life balance.", "life balance"], ["mindfulness", "sự chú tâm vào hiện tại", "/ˈmaɪndfəlnəs/", "practise mindfulness", "Mindfulness can help me manage stress.", "awareness"], ["errand", "việc vặt phải đi ra ngoài", "/ˈerənd/", "run errands", "I run errands on Saturday mornings.", "task"], ["household", "thuộc gia đình, hộ gia đình", "/ˈhaʊshəʊld/", "household chores", "We share household responsibilities.", "domestic"], ["maintenance", "sự bảo trì, duy trì", "/ˈmeɪntənəns/", "routine maintenance", "Regular maintenance keeps appliances working.", "upkeep"], ["clutter", "đồ đạc bừa bộn", "/ˈklʌtə/", "clear clutter", "I clear clutter from my desk.", "mess"], ["declutter", "dọn bớt đồ không cần thiết", "/ˌdiːˈklʌtə/", "declutter a room", "I declutter my room every month.", "tidy up"], ["reorganise", "sắp xếp lại", "/ˌriːˈɔːɡənaɪz/", "reorganise belongings", "I reorganise my desk before exams.", "rearrange"], ["stock up on", "mu const TOPICS=Object.keys(DECKS);
const EXTRA=['Education & Learning','Environment & Climate','Technology & AI','Work & Careers','Health & Medicine','Travel & Transport','Food & Cooking','Cities & Housing','Science & Research','Media & Communication','Family & Relationships','Sports & Fitness','Art & Culture','Business & Economics','Shopping & Money','Describing Places','Academic Verbs'];
const KEY='ielts-vocab-master-standalone-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{}
let state={tab:'topics',topic:TOPICS[0],index:0,flip:false,recallMode:'en',answer:'',revealed:false,quizIndex:0,quizAnswers:{},quizDone:false,analysis:'',max:60,...saved.ui};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const days=n=>new Date(Date.now()+n*86400000).toISOString().slice(0,10);
const id=(topic,w)=>topic+'|'+w[0];
const current=()=>DECKS[state.topic][state.index%DECKS[state.topic].length];
const total=()=>DECKS[state.topic].length;
const norm=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ');
function persist(){localStorage.setItem(KEY,JSON.stringify({memory,attempts,ui:{topic:state.topic,index:state.index,tab:state.tab}}))}
function rating(n){const key=id(state.topic,current());const old=memory[key]||{};const interval=n===3?Math.max(3,(old.interval||1)*2):n===2?1:0;memory[key]={rating:n,interval,due:days(interval),last:today()};persist();render()}
function dueList(){return Object.entries(memory).filter(([k,v])=>v.rating<3||v.due<=today())}
function switchTab(t){state.tab=t;state.revealed=false;state.answer='';state.flip=false;persist();render()}
function chooseTopic(t){state.topic=t;state.index=0;state.flip=false;switchTab('learn')}
function next(){state.index=(state.index+1)%total();state.flip=false;state.revealed=false;state.answer='';render()}
function prev(){state.index=Math.max(0,state.index-1);state.flip=false;state.revealed=false;state.answer='';render()}
function speak(){const w=current();if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w[0]);u.lang='en-GB';speechSynthesis.speak(u)}}
function header(){const entries=Object.values(memory);$('mastered').textContent=entries.filter(v=>v.rating===3).length;$('weak').textContent=entries.filter(v=>v.rating===1).length;$('due').textContent=dueList().length;const tabs=[['topics','⌂','Topics'],['learn','▣','Learn'],['recall','◉','Recall'],['review','↻','Review'],['analyze','▤','Analyze']];$('tabs').innerHTML=tabs.map(([key,icon,label])=>`<button class="tab ${state.tab===key?'active':''}" onclick="switchTab('${key}')"><div style="font-size:21px">${icon}</div>${label}</button>`).join('')}
function topics(){return `<h2>Vocabulary Topic Library</h2><p class="muted">Choose a topic and build your vocabulary with flashcards and active recall.</p><div class="grid">${TOPICS.map(t=>`<button class="tile" onclick="chooseTopic(${JSON.stringify(t).replace(/"/g,'&quot;')})"><div style="font-size:26px">📚</div><b>${esc(t)}</b><span>${DECKS[t].length} words · B2–C1</span></button>`).join('')}</div><h2 style="margin-top:24px">More topics</h2><p class="note">These collections are planned, not yet populated.</p><div class="grid">${EXTRA.map(t=>`<div class="tile"><b>${esc(t)}</b><span>Coming soon</span></div>`).join('')}</div>`}
function learn(){const w=current();return `<div class="row" style="justify-content:space-between"><h2>${esc(state.topic)}</h2><span class="tag">${state.index+1}/${total()}</span></div><div class="flash" onclick="state.flip=!state.flip;render()">${state.flip?`<div class="tag">MEANING</div><h1>${esc(w[1])}</h1><p><b>Collocation:</b> ${esc(w[3])}</p><p><i>${esc(w[4])}</i></p><p class="muted">Synonym: ${esc(w[5])}</p>`:`<div class="tag">FLASHCARD</div><h1>${esc(w[0])}</h1><div class="muted">${esc(w[2])}</div><p class="muted">Tap to reveal meaning</p>`}</div><div class="row block"><button class="btn alt" onclick="speak()">🔊 Pronounce</button><button class="btn bad" onclick="rating(1)">Again</button><button class="btn alt" onclick="rating(2)">Hard</button><button class="btn good" onclick="rating(3)">Got it</button></div><div class="row"><button class="btn alt" onclick="prev()">← Previous</button><button class="btn" onclick="next()">Next →</button></div><button class="btn alt block" style="width:100%" onclick="switchTab('recall')">Start Active Recall</button>`}
function recall(){const w=current();return `<h2>Active Recall</h2><p class="note">Recall without looking. Wrong answers enter your review pool.</p><div class="row"><button class="btn ${state.recallMode==='en'?'':'alt'}" onclick="state.recallMode='en';state.revealed=false;render()">VI → EN</button><button class="btn ${state.recallMode==='vi'?'':'alt'}" onclick="state.recallMode='vi';state.revealed=false;render()">EN → VI</button></div><div class="card block"><span class="tag">Question ${state.index+1}/${total()}</span><h2 style="margin-top:18px">${esc(state.recallMode==='en'?w[1]:w[0])}</h2><input class="field" id="answer" placeholder="${state.recallMode==='en'?'Type the English word':'Nhập nghĩa tiếng Việt'}" value="${esc(state.answer)}" oninput="state.answer=this.value"><button class="btn" style="width:100%" onclick="checkRecall()">Check answer</button>${state.revealed?`<div class="card block"><b>${esc(state.recallMode==='en'?w[0]:w[1])}</b><p>${esc(w[4])}</p><div class="row"><button class="btn bad" onclick="rating(1)">Need review</button><button class="btn good" onclick="rating(3)">Remembered</button></div><button class="btn alt block" onclick="next()">Next →</button></div>`:''}</div><button class="btn alt" onclick="startQuiz()">20-question Vocabulary Test</button>`}
function checkRecall(){const w=current(),key=id(state.topic,w);state.answer=$('answer').value;attempts[key]=(attempts[key]||0)+1;if(state.recallMode==='en'&&norm(state.answer)!==norm(w[0]))ratingSilent(1);state.revealed=true;persist();render()}
function ratingSilent(n){const key=id(state.topic,current());memory[key]={rating:n,interval:0,due:today(),last:today()}}
function startQuiz(){state.quizIndex=0;state.quizAnswers={};state.quizDone=false;switchTab('test')}
function quiz(){const words=DECKS[state.topic],i=state.quizIndex,w=words[i%words.length],options=[w[0],words[(i+3)%words.length][0],words[(i+7)%words.length][0]].filter((v,j,a)=>a.indexOf(v)===j);if(state.quizDone){let score=Array.from({length:20},(_,j)=>state.quizAnswers[j]===words[j%words.length][0]?1:0).reduce((a,b)=>a+b,0);return `<h2>Test Results: ${score}/20</h2><p>Incorrect answers are marked for review.</p>${Array.from({length:20},(_,j)=>j).filter(j=>state.quizAnswers[j]!==words[j%words.length][0]).map(j=>`<div class="card block"><b>${esc(words[j%words.length][0])}</b><p>${esc(words[j%words.length][1])}</p></div>`).join('')}<button class="btn" onclick="startQuiz()">Retake test</button>`}return `<h2>Vocabulary Test</h2><p class="muted">Question ${i+1}/20</p><div class="progress"><div style="width:${(i+1)*5}%"></div></div><div class="card block"><h2>${esc(w[1])}</h2>${options.map(o=>`<button class="choice ${state.quizAnswers[i]===o?'selected':''}" onclick="state.quizAnswers[${i}]=${JSON.stringify(o).replace(/"/g,'&quot;')};render()">${esc(o)}</button>`).join('')}<button class="btn block" style="width:100%" ${!state.quizAnswers[i]?'disabled':''} onclick="advanceQuiz()">${i===19?'Finish test':'Next question →'}</button></div>`}
function advanceQuiz(){if(state.quizIndex<19){state.quizIndex++;render();return}const words=DECKS[state.topic];for(let i=0;i<20;i++){let w=words[i%words.length];if(state.quizAnswers[i]!==w[0])memory[id(state.topic,w)]={rating:1,interval:0,due:today(),last:today()}}state.quizDone=true;persist();render()}
function reviewPage(){const due=dueList();return `<h2>Smart Review</h2><p class="note">Review words you marked Again/Hard and mastered words when they become due.</p>${due.length?due.map(([key,m])=>{const [topic,word]=key.split('|');return `<button class="choice" onclick="chooseReview(${JSON.stringify(topic).replace(/"/g,'&quot;')},${JSON.stringify(word).replace(/"/g,'&quot;')})"><b>${esc(word)}</b><div class="note">${esc(topic)} · Due ${esc(m.due)}</div></button>`}).join(''):'<div class="card">No words due yet. Start learning to build your review list.</div>'}` }
function chooseReview(t,word){state.topic=t;state.index=DECKS[t].findIndex(w=>w[0]===word);switchTab('recall')}
function analyze(){return `<h2>IELTS Test Analyzer</h2><p class="note">Offline matching against the built-in B2–C1 vocabulary library. For full AI extraction of up to 60 new words from any IELTS exam, a secure server API must be connected.</p><label>Paste IELTS passage or transcript</label><textarea class="field" rows="8" id="passage" placeholder="Paste text here...">${esc(state.analysis)}</textarea><label>Maximum items</label><select class="field" id="limit"><option>20</option><option>40</option><option selected>60</option></select><button class="btn" style="width:100%" onclick="runAnalyze()">Find vocabulary matches</button><div id="analysis-results" class="block"></div>`}
function runAnalyze(){state.analysis=$('passage').value;let text=state.analysis.toLowerCase();let matches=TOPICS.flatMap(t=>DECKS[t].map(w=>({topic:t,w}))).filter(x=>new RegExp('(^|[^a-z])'+x.w[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^a-z])','i').test(text)).slice(0,+$('limit').value);$('analysis-results').innerHTML=matches.length?`<p><b>${matches.length} matching vocabulary items</b></p>`+matches.map(x=>`<div class="card block"><b>${esc(x.w[0])}</b> <span class="muted">${esc(x.w[2])}</span><p>${esc(x.w[1])}</p><p class="note">${esc(x.w[3])} · ${esc(x.w[5])}</p></div>`).join(''):'<div class="card">No matches found in the built-in library. This is not yet AI extraction.</div>'}
function render(){header();$('content').innerHTML=state.tab==='topics'?topics():state.tab==='learn'?learn():state.tab==='recall'?recall():state.tab==='review'?reviewPage():state.tab==='test'?quiz():analyze()}
render();
</script></body></html>
